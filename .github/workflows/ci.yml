name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Tests run on Postgres, never on the SQLite dev fallback: SQLite differs
    # on constraint enforcement, transactions and JSON, so a green SQLite run
    # would not prove the migration or the constraint works in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridgga
          POSTGRES_PASSWORD: bridgga
          POSTGRES_DB: bridgga_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://bridgga:bridgga@localhost:5432/bridgga_test
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy apps config
        continue-on-error: true  # advisory until annotations are complete

      - name: Django system checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Long enough to satisfy security.W009. The step runs with
          # --fail-level WARNING, so a short throwaway secret fails the build
          # on the very check it exists to perform. Not a real secret: it is
          # public in this file and only lets the prod settings import.
          DJANGO_SECRET_KEY: ci-only-not-a-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DJANGO_ALLOWED_HOSTS: example.com
          AWS_STORAGE_BUCKET_NAME: ci-bucket
          EMAIL_HOST: smtp.example.com

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Tenant isolation suite
        # Run again on its own so a failure here is unmistakable in the log,
        # and so -x stops at the first cross-tenant leak.
        run: pytest -m tenancy -x -q

      - name: Export OpenAPI schema
        run: python manage.py spectacular --fail-on-warn --file schema.yml

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/schema.yml

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
